# Sends a signed .msix to the Microsoft Store's certification once the submission before it has left certification:
# the Store takes one submission at a time. AkhiBrowser Release turns it on; it sends the latest GitHub release's version
# (signed after that release was made), or what the repository variable MSSTORE_NEXT says: a version (1.3.5: the newest
# signed draft in akhi-extension with its .msix, signed after MSSTORE_AFTER) or to a signed draft (signed-<run>-<attempt>);
# after the upload it disables itself, so it runs once.
name: Microsoft Store when free

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cloud-release
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AKHI_SUBMODULES_TOKEN }}
      DRAFT: ${{ vars.MSSTORE_NEXT }}
      # with a version: only drafts signed after this time (ISO 8601), so an earlier test build isn't taken
      AFTER: ${{ vars.MSSTORE_AFTER }}
    steps:
      - uses: microsoft/setup-msstore-cli@v1

      - name: Is the Store free?
        id: status
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          if [ -z "$DRAFT" ]; then
            # the latest release of akhiBrowser, and only what was signed after it was made
            release=$(gh api repos/halgurdh/akhiBrowser/releases/latest --jq '.tag_name + " " + .created_at')
            DRAFT=$(echo "$release" | cut -d" " -f1 | sed 's/^v//')
            [ -n "$AFTER" ] || AFTER=$(echo "$release" | cut -d" " -f2)
            echo "The latest release: $DRAFT ($AFTER)"
          fi
          if [[ "$DRAFT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            msix="AkhiBrowser-$DRAFT-x64.msix"
            found=$(gh api "repos/halgurdh/akhi-extension/releases?per_page=100" --jq "[.[] | select(.draft and (.tag_name|startswith(\"signed-\")) and .created_at >= \"${AFTER:-0}\" and any(.assets[]; .name == \"$msix\"))] | sort_by(.created_at) | last | .tag_name // empty")
            [ -n "$found" ] || { echo "No signed $msix yet"; echo "free=no" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "DRAFT=$found" >> "$GITHUB_ENV"
            echo "Signed draft: $found"
          fi
          sudo apt-get install -y -qq libsecret-1-0 gnome-keyring dbus-x11 > /dev/null
          eval "$(dbus-launch --sh-syntax)"
          printf 'ci-keyring' | gnome-keyring-daemon --replace --daemonize --unlock --components=secrets > /dev/null
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          msstore reconfigure --tenantId "$TENANT" --clientId "$CLIENT" --clientSecret "$SECRET" --sellerId "$SELLER" > /dev/null
          status=$(msstore submission status 9N8KMF22Z6K4 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /dev/stderr)
          if echo "$status" | grep -qE "Submission Status = (Certification|PreProcessing|CommitStarted|Publishing|PendingCommit)"; then
            echo "Still busy"; echo "free=no" >> "$GITHUB_OUTPUT"
          else
            echo "free=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: To certification
        if: steps.status.outputs.free == 'yes'
        run: |
          mkdir in
          gh release download "$DRAFT" --repo halgurdh/akhi-extension --pattern "*.msix" --dir in
          msix=$(ls in/*.msix | head -n 1)
          echo "Sending $msix"
          msstore publish "$msix" -id 9N8KMF22Z6K4
          GH_TOKEN=${{ github.token }} gh workflow disable msstore-when-free.yml --repo "$GITHUB_REPOSITORY"

      - name: Mail
        if: steps.status.outputs.free == 'yes' || failure()
        env:
          AKHI_OPS_TOKEN: ${{ secrets.AKHI_OPS_TOKEN }}
        run: |
          [ -n "$AKHI_OPS_TOKEN" ] || exit 0
          text="Microsoft Store: $DRAFT sent to certification: ${{ job.status }}
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg subject "AkhiBrowser: Microsoft Store upload ${{ job.status }}" --arg text "$text" '{subject: $subject, text: $text}' |
            curl -fsS -m 30 -X POST https://akhi-license.akhibrowser.workers.dev/ops/notify \
              -H "Authorization: Bearer $AKHI_OPS_TOKEN" -H "Content-Type: application/json" --data-binary @- > /dev/null || true
